name: Élő árak frissítése

# 6:00 és éjfél között minden páros órában (budapesti idő) frissítteti az élő áras aloldalak árait a tárhelyen
# (ugyanúgy, mint a lábléc évszámára kattintva), akkor is, ha épp nincs látogató. Az aloldalak listája az
# elo_oldalak.json (a frissites.py készíti az ARFRISSITO alapján), így új aloldalnál nem kell ide írni semmit. A GitHub világidőben (UTC) ütemez:
# télen (UTC+1) a budapesti 6, 8, … 24 óra = UTC 5, 7, … 23; nyáron (UTC+2) = UTC 4, 6, … 22.
# Márciusban és októberben (óraátállítás) mindkét sor fut; a fölösleges (páratlan órás) futást a
# .github/arfrissites.py kihagyja. Kézzel is indítható (Actions → Run workflow).
on:
  schedule:
    - cron: "3 5-23/2 * 1-3,10-12 *"
    - cron: "3 4-22/2 * 3-10 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frissites:
    name: Élő áras oldalak lekérése
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Frissítés
        run: python .github/arfrissites.py
