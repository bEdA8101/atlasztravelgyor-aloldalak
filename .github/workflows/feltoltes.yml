name: Feltöltés a tárhelyre

# Minden feltöltés (push) után a main ágra, és kézzel is indítható
# az Actions fülön a "Run workflow" gombbal.
on:
  push:
    branches: [main]
  workflow_dispatch:

# egyszerre csak egy feltöltés fusson (a napi frissítéssel közösen)
concurrency:
  group: feltoltes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  feltoltes:
    name: Feltöltés FTP-n
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_SZERVER: ${{ secrets.FTP_SZERVER }}
      FTP_FELHASZNALO: ${{ secrets.FTP_FELHASZNALO }}
      FTP_JELSZO: ${{ secrets.FTP_JELSZO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Nincsenek még megadva az FTP-adatok
        if: env.FTP_SZERVER == ''
        run: echo "Az FTP-adatok még nincsenek megadva (Settings → Secrets and variables → Actions), a feltöltés kimarad."
      - name: Feltöltés
        if: env.FTP_SZERVER != ''
        run: python feltoltes.py
      - name: Élő árak előkészítése (az első látogatónak se kelljen várnia)
        if: env.FTP_SZERVER != ''
        continue-on-error: true
        run: |
          for cim in oman/api.php vietnam/api.php riu/api.php maldiv/api.php "mauritius/api.php?a=ajanlatok"; do
            nev="${cim%%/*}"
            curl -s -o /dev/null -A "AtlaszTravelGyor-elomelegito/1.0" --max-time 280 -w "$nev: %{http_code}, %{time_total} mp\n" "https://$nev.atlasztravelgyor.hu/${cim#*/}" || true
          done
